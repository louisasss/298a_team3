name: Publish image to GHCR

on:
  push:
    branches:
      - main
      # TEMPORARY (T3-75 proof): lets this branch run the workflow
      # before it lands on main. Remove before review.
      - akshittyagi/t3-75-build-and-push-commit-sha-tagged-images-to-GHCR-on-merge
  workflow_dispatch:


permissions:
  contents: read
  packages: write


jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor}}
          password: ${{secret.GITHUB_TOKEN}}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/louisasss/298a_team3/parcelpost:${{ github.sha}}
          build-args: |
            APP_VERSION=${{ github.sha}}