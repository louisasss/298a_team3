name: Update image tag in overlay

on:
  workflow_run:
    workflows: ["Publish image to GHCR"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-image-tag
  cancel-in-progress: false

jobs:
  update-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set image tag in the local overlay
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd k8s/overlays/local
          kustomize edit set image traefik/whoami=ghcr.io/louisasss/298a_team3/parcelpost:${IMAGE_SHA}

      - name: Commit and push the tag update
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/local/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag already up to date, nothing to commit."
          else
            git commit -m "release: update image tag to ${IMAGE_SHA} [T3-76]"
            git push
          fi
