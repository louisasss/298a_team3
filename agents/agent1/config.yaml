# Agent 1 configuration. See docs/adr/003-single-tool-agent.md

model:
  provider: "anthropic"
  name: "claude-haiku-5-5"  # Sonnet 5.5 (claude-sonnet-5-5) is the other candidate; swap here for the comparison (T3-107)
  api_key_env: "API_KEY"
  price_per_million_tokens:
    input: 0.10                
    output: 0.50


budgets:
  ci_pr:
    max_seconds: 120
    max_tool_calls: 8
    max_tokens: 12000
    max_cost_usd: 0.035
  ci_release:
    max_seconds: 90
    max_tool_calls: 8
    max_tokens: 15000
    max_cost_usd: 0.035
  analysis:
    max_seconds: 30
    max_tool_calls: 10
    max_tokens: 12000
    max_cost_usd: 0.035
