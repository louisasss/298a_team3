apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-local
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/louisasss/298a_team3.git
    targetRevision: main  
    path: k8s/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true