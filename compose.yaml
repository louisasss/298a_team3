services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parcelpost
      POSTGRES_PASSWORD: parcelpost
      POSTGRES_DB: parcelpost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpost -d parcelpost"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://parcelpost:parcelpost@db:5432/parcelpost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
