apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: parcelpost-db
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: parcelpost-db
  template:
    metadata:
      labels:
        app: parcelpost-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: parcelpost
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
