apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: traefik/whoami:v1.11.0

          envFrom:
            - configMapRef:
                name: app-config

          ports:
            - containerPort: 80

          # TODO: Enable once the real app exposes /healthz and /readyz.
          # livenessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: 80
          #
          # readinessProbe:
          #   httpGet:
          #     path: /readyz
          #     port: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

  strategy:
    canary:
      stableService: app-stable
      canaryService: app-canary

      trafficRouting:
        traefik:
          weightedTraefikServiceName: app-traffic
      steps:
      - setWeight: 10
      - pause: {}
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 100