apiVersion: v1
kind: Service
metadata:
  name: app-stable
  labels:
    monitoring: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-canary
  labels:
    monitoring: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: 80