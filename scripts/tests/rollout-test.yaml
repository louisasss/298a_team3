apiVersion: v1
kind: Namespace
metadata:
  name: rollout-demo
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-demo
  namespace: rollout-demo
spec:
  replicas: 5

  selector:
    matchLabels:
      app: rollouts-demo

  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}